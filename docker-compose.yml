services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - medikiosk_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_ORIGINS: https://medikiosksih26.vercel.app/
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-access-secret-change-before-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-refresh-secret-change-before-production}
      OTP_SECRET: ${OTP_SECRET:-local-otp-secret-change-before-production}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-medikiosk}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:-http://localhost:9000}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:-local}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:-local-access-key}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:-local-secret-key}
      SUPABASE_S3_BUCKET: ${SUPABASE_S3_BUCKET:-medikiosk}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"
    volumes:
      - medikiosk_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://sih2026-t80s.onrender.com}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  medikiosk_mongo_data:
  medikiosk_uploads:
